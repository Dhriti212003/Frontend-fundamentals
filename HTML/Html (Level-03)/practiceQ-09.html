    Practice Qs 9
    1. Recreate the following form with suitable elements & input types
-->
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PracticeQ-09</title>
    </head>
    <body>
        <form action="/server">
          <h3>Registration Form</h3>
          <div>
            <input type="text" id="firstname" name="firstname" placeholder="enter first name"/>
            <input type="text" id="lastname" name="lastname" placeholder="enter last name"/>
          </div>
          <div>Please select gender<select name="gender" id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
          </div>
          <div>
            Do you agree to all terms of service? 
            <input type="checkbox" id="terms" name="terms"><label for="terms">Yes, I agree</label>
          </div>
          <button >Register</button>
        </form>
    </body>
    </html>
