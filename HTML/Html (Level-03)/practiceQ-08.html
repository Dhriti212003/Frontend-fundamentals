<!--
    Practice Qs 8
    1. Create a search option that redirects its search request to google
-->
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <form action="https://www.google.com/search?">
          <input type="text" id="search" placeholder="Type" name="q"/>
          <button >Search</button>
        </form>
    </body>
    </html>
