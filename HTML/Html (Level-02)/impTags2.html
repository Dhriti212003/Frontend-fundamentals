<!--  
   1. Sematic Markup : It is the markup that relates to the meaning of content
      Advantages:
          - meaningful/layout ->Structured
          - SEO friendly
          - readable + screen readers -> UX improves
   2. Sematic Tags
   3. HTML Entities : 
      - HTML entities are special codes used to display characters and symbols that have reserved meanings in HTML or are hard to type directly. 
      - They always start with an ampersand (&) and end with a semicolon (;).
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Level - 02</title>
</head>
<body>
    <header>
        Apna College
        <a href="www.apnacollege.in">go to main page</a>
    <nav>
        <ul>
            <li>
                <a href="about.html">About</a>
            </li>
            <li>
                <a href="about.html">Contact</a>
            </li>
        </ul>
    </nav>
    </header>
    <main>
        This is my main content.
    </main>
    
    <footer>
        Made with &hearts; by Dhriti
    </footer>

    <!-- 3. HTML Entities -->
    
    <h1>a&gtb</h1>
    <p>apna&nbsp;college</p>
    <p>a &lt; b</p>
    <p>a &gt; b</p>
    <p>a &amp; b</p>
    <p>a &quot;b&quot;</p>
    <h1>&bigstar;</h1>
</body>
</html>
