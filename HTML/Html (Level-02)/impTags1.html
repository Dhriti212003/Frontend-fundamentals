<!-- 
   1. inline v/s block
      - block elements : takes up the full width available. Start from new line
      - inline eleements : takes only necessary width. Don't start from new line
   2. div element
   3. span element : generic container used to hold other html elements or group elements together. It is a inline element
   4. hr tag
   5. Supscript & Subscript tags 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1. block v/s inline -->
    <!-- Block element : <h1>, <p> -->
        <h1>Apna College</h1>
        <h1>HTML lessons</h1>
        <p>hello , I'm Dhriti</p>
    <!-- Inline element : <a/>, <img/> -->
        <a href="https//www.google.com">google</a>

        <br/>
    
    <!-- 2. div element -->
     <div>
        <a href="www.google.com">GOOGLE</a>
        <a href="www.youtube.com">YOUTUBE</a>
    </div>
    <a href="www.facebook.com">FACEBOOK</a>

    <br/>

    <!-- 3. span element -->
    <span>
        <a href="www.google.com">GOOGLE</a>
        <a href="www.youtube.com">YOUTUBE</a>
    </span>
    <a href="www.facebook.com">FACEBOOK</a>
    
    <br/>

    <!-- 4. hr tag -->
    <p>This is my name : Dhriti.
        <hr/>I'm learning Web development.</p>

    <br/>

    <!-- 5. Sub & Sup Tag -->
     <p>Using Sub tag : <br/> x<sub>1</sub>+y<sub>2</sub> = 20 </p>
     <p>Using Sup Tag : <br/> (a<sup>2</sup>+b<sup>2</sup>) = a<sup>2</sup> + b<sup>2</sup> +2ab</p>
     
</body>
</html>
