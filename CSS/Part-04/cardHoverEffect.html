<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover Effect</title>
    <link rel="stylesheet" href="cardHoverEffect.css"/>
</head>
<body>
    <div>
        <div class="card">
            <img src="./images/man.jpg" alt="man"/>
            <div class="desc">
                <h3>
                Rahul Sharma
                </h3>
                <p>
                Software Engineer
                </p>
            </div>
        </div>
        <div class="card">
            <img src="./images/woman.jpg" alt="women"/>
            <div class="desc">
                <h3>
                Piyusha Rao
                </h3>
                <p>
                HR Manager
                </p>
            </div>
        </div>
    </div>


    
</body>
</html>
